[package]
name = "kanaemi-windows"
description = "The Windows input method, a Text Services Framework COM DLL"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "kanaemi"
crate-type = ["cdylib", "rlib"]

[dependencies]
kanaemi-core.workspace = true
kanaemi-runtime.workspace = true

[target.'cfg(windows)'.dependencies]
kanaemi-config.workspace = true
kanaemi-engine.workspace = true
tracing = { version = "0.1", features = ["release_max_level_info"] }
windows-core = "0.100.0"

# The bindings are generated for whichever target is built, so the generator
# is needed on every host that may build for Windows.
[build-dependencies]
windows-bindgen = "0.100.0"
