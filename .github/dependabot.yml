version: 2
updates:
  # Only Cargo: GitHub Actions are pinned through `gh actions-lock`, whose
  # lockfile Dependabot would leave behind.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # windows-bindgen writes bindings for the windows-core of its own
      # version, so bumping either alone leaves code the other cannot build.
      windows:
        patterns:
          - windows-bindgen
          - windows-core
      cargo:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
