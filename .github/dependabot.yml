version: 2
updates:
  # Only Cargo: GitHub Actions are pinned through `gh actions-lock`, whose
  # lockfile Dependabot would leave behind.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
