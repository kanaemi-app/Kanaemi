version: 2
updates:
  # Only Cargo: GitHub Actions are pinned through `gh actions-lock`, whose
  # lockfile Dependabot would leave behind.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # windows re-exports the traits of the windows-core it depends on, so
      # bumping either alone leaves two incompatible versions in the build.
      windows:
        patterns:
          - windows
          - windows-core
      cargo:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
