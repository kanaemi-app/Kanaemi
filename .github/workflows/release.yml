# This workflow is managed by gh actions-lock.

name: Release

# Publishing a release makes the installers for each OS from its tag and
# attaches them to it, with the catalog of them (index.json).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      sign: true
    # A called workflow reads the secrets of the environment "release" only
    # when they are inherited; they cannot be passed by name.
    secrets: inherit

  # The flake as github:kanaemi-app/kanaemi/vX.Y.Z fetches it: from the archive
  # GitHub serves, whose VERSION holds the tag. Building that proves the
  # package is the release, and pins the exact build such an install looks up
  # in the cache, so the cache's retention never collects it.
  nix:
    uses: lambdalisue/nix-github-release/.github/workflows/build.yml@v0.1.0
    with:
      ref: ${{ github.event.release.tag_name }}
      cachix-cache: kanaemi
      cachix-pin: release
    secrets:
      cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  upload:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      - name: Gather the descriptions into the catalog
        run: |
          jq -s --arg version "$TAG" \
            '{format: 2, version: $version, packages: sort_by(.os, .arch, .framework, .format)}' \
            packages/*.json >index.json
          rm packages/*.json
        env:
          TAG: ${{ github.event.release.tag_name }}
      # --clobber lets a rerun replace what an earlier attempt attached.
      - run: gh release upload "$TAG" packages/* index.json --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  # The site lists what this release ships, so it is built again once the
  # release holds everything. This repository's token cannot run another
  # repository's workflows, so a token that may run the site's is kept as a
  # secret.
  site:
    needs: upload
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: gh workflow run deploy.yml --repo kanaemi-app/kanaemi-app.github.io --ref main
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}

  # The Homebrew cask names the app of the latest release, so the tap writes
  # it again once the release holds the app. As for the site, a token that may
  # run the tap's workflows is kept as a secret.
  homebrew:
    needs: upload
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: gh workflow run update.yml --repo kanaemi-app/homebrew-tap --ref main
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
